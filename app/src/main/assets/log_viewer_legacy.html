<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>Log Viewer (H5 Engine)</title>
    <style>
        :root {
          --bg: #0b0b0c;
          --fg: #e6e6e6;
          --border: rgba(255,255,255,0.15);
          --accent: #4caf50;
        }
        @media (prefers-color-scheme: light) {
          :root {
            --bg: #ffffff;
            --fg: #1f1f1f;
            --border: rgba(0,0,0,0.15);
            --accent: #2e7d32;
          }
        }
        html, body {
          margin: 0;
          padding: 0;
          background: var(--bg);
          color: var(--fg);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
          line-height: 1.35;
          font-size: 9px;
          -webkit-text-size-adjust: 100%;
          /* 开启原生平滑滚动与 GPU 硬件加速 */
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
        }

        /* 遵循 Android 原生 Overlay 风格的专业触控滚动条 */
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track {
          background: transparent;
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(160, 160, 160, 0.4);
          border-radius: 6px;
          border: 2px solid transparent;
          background-clip: padding-box;
          transition: background-color 0.2s ease;
        }
        ::-webkit-scrollbar-thumb:hover,
        ::-webkit-scrollbar-thumb:active {
          background: var(--accent);
        }

        #log { 
          white-space: pre-wrap; 
          word-break: break-all; 
          padding: 8px 12px 60px 8px; 
          user-select: text; 
          -webkit-user-select: text; 
        }

        .line {
          min-height: 1.25em;
        }

        .highlight { background-color: #ffd54f; color: #000; font-weight: bold; padding: 0 2px; border-radius: 2px; }
        .highlight-current { background-color: #ff9800; color: #fff; font-weight: bold; padding: 0 2px; border-radius: 2px; outline: 2px solid #ff5722; }

        /* 与 Compose RequestNavigator 100% 对齐的 RPC 计数悬浮胶囊 */
        .rpc-fab-capsule {
          position: fixed;
          right: 14px;
          bottom: 24px;
          display: flex;
          align-items: center;
          background: rgba(30, 30, 30, 0.88);
          backdrop-filter: blur(12px);
          color: #fff;
          border: 1px solid var(--border);
          border-radius: 24px;
          padding: 2px 6px;
          box-shadow: 0 4px 16px rgba(0,0,0,0.4);
          z-index: 90;
          will-change: transform, opacity;
          transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .rpc-fab-arrow {
          background: transparent;
          border: none;
          color: #fff;
          font-size: 11px;
          padding: 4px 8px;
          cursor: pointer;
          user-select: none;
        }
        .rpc-fab-arrow:active {
          color: var(--accent);
        }
        .rpc-fab-count {
          font-size: 11px;
          font-weight: bold;
          padding: 0 6px;
          cursor: pointer;
          user-select: none;
          color: #fff;
        }

        /* Modal for RPC Outline */
        .modal {
          display: none;
          position: fixed;
          top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.65);
          z-index: 200;
          align-items: center;
          justify-content: center;
        }
        .modal-content {
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          width: 90%;
          max-width: 500px;
          max-height: 75vh;
          display: flex;
          flex-direction: column;
          box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-header {
          padding: 12px 16px;
          border-bottom: 1px solid var(--border);
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-weight: bold;
        }
        .modal-body {
          padding: 8px;
          overflow-y: auto;
          flex: 1;
        }
        .outline-item {
          padding: 10px 12px;
          border-bottom: 1px solid rgba(255,255,255,0.05);
          font-size: 12px;
          cursor: pointer;
          word-break: break-all;
        }
        .outline-item:active {
          background: rgba(255,255,255,0.15);
        }
        .outline-tag {
          font-size: 10px;
          color: var(--accent);
          margin-right: 6px;
        }
    </style>
</head>
<body>

<!-- 纯粹全屏 H5 日志文本画布 -->
<div id="log"></div>

<!-- 与 Compose 统一的 RPC 计数悬浮胶囊 (▲ 1/15 ▼) -->
<div id="rpcNavigator" class="rpc-fab-capsule">
    <button class="rpc-fab-arrow" onclick="prevRpcMatch()">▲</button>
    <span id="rpcCountText" class="rpc-fab-count" onclick="showRpcOutline()">0/0</span>
    <button class="rpc-fab-arrow" onclick="nextRpcMatch()">▼</button>
</div>

<!-- RPC 大纲 Modal -->
<div id="rpcModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>RPC Method 大纲</span>
            <button class="rpc-fab-arrow" style="padding: 2px 8px;" onclick="closeRpcOutline()">✕</button>
        </div>
        <div class="modal-body" id="rpcList"></div>
    </div>
</div>

<script>
    const logEl = document.getElementById('log');
    const rpcNavEl = document.getElementById('rpcNavigator');
    const rpcCountText = document.getElementById('rpcCountText');

    let fullLogText = '';
    let currentSearchKeyword = '';
    let searchMatches = [];
    let rpcBoundaryIndices = [];
    let currentRpcIndex = -1;

    let lastScrollY = window.scrollY;
    let isTicking = false;

    /**
     * 高性能无阻塞 60fps 滚动监听：使用 requestAnimationFrame 防抖节流 + { passive: true }
     */
    function onScrollHandler() {
        const currentScrollY = window.scrollY;

        // 向下滑动隐藏悬浮胶囊，向上滑动/静止显示
        if (currentScrollY > lastScrollY && currentScrollY > 40) {
            rpcNavEl.style.opacity = '0';
            rpcNavEl.style.transform = 'translateY(16px)';
        } else {
            rpcNavEl.style.opacity = '1';
            rpcNavEl.style.transform = 'translateY(0)';
        }
        lastScrollY = currentScrollY;

        updateCurrentRpcCounter();
        isTicking = false;
    }

    // 绑定 { passive: true }，完美释放 GPU Compositor 主线程卡顿
    window.addEventListener('scroll', () => {
        if (!isTicking) {
            window.requestAnimationFrame(onScrollHandler);
            isTicking = true;
        }
    }, { passive: true });

    function render() {
        if (!fullLogText) {
            logEl.innerHTML = '';
            rpcNavEl.style.display = 'none';
            return;
        }

        const lines = fullLogText.split('\n');
        const fragment = document.createDocumentFragment();
        rpcBoundaryIndices = [];

        lines.forEach((lineText, lineIdx) => {
            if (lineText.includes('========================>')) {
                rpcBoundaryIndices.push(lineIdx);
            }
            const div = document.createElement('div');
            div.className = 'line';
            div.id = `line-${lineIdx}`;
            div.textContent = lineText;
            fragment.appendChild(div);
        });

        logEl.innerHTML = '';
        logEl.appendChild(fragment);

        if (rpcBoundaryIndices.length > 0) {
            rpcNavEl.style.display = 'flex';
            currentRpcIndex = 0;
            updateCurrentRpcCounter();
        } else {
            rpcNavEl.style.display = 'none';
        }

        if (currentSearchKeyword) {
            highlightKeyword(currentSearchKeyword, false, false);
        }
    }

    function updateCurrentRpcCounter() {
        if (rpcBoundaryIndices.length === 0) return;

        const scrollY = window.scrollY;
        const estimatedLineIndex = Math.max(0, Math.floor(scrollY / 13.5));
        
        let foundIdx = 0;
        for (let i = 0; i < rpcBoundaryIndices.length; i++) {
            if (rpcBoundaryIndices[i] <= estimatedLineIndex) {
                foundIdx = i;
            } else {
                break;
            }
        }
        currentRpcIndex = foundIdx;
        rpcCountText.textContent = `${currentRpcIndex + 1}/${rpcBoundaryIndices.length}`;
    }

    function prevRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        currentRpcIndex = (currentRpcIndex - 1 + rpcBoundaryIndices.length) % rpcBoundaryIndices.length;
        jumpToLine(rpcBoundaryIndices[currentRpcIndex]);
        updateCurrentRpcCounter();
    }

    function nextRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        currentRpcIndex = (currentRpcIndex + 1) % rpcBoundaryIndices.length;
        jumpToLine(rpcBoundaryIndices[currentRpcIndex]);
        updateCurrentRpcCounter();
    }

    function setFullText(text) {
        fullLogText = text || '';
        render();
    }

    function initLogBridge() {
        try {
            if (window.LogBridge && typeof window.LogBridge.getFullText === 'function') {
                const text = window.LogBridge.getFullText();
                setFullText(text);
            }
        } catch (e) {
            console.error("LogBridge error:", e);
        }
    }

    function highlightKeyword(keyword, isCaseSensitive, isRegex) {
        currentSearchKeyword = keyword || '';
        searchMatches = [];

        if (!currentSearchKeyword) {
            render();
            return;
        }

        let searchRegex;
        try {
            const flags = isCaseSensitive ? 'g' : 'gi';
            const pattern = isRegex ? currentSearchKeyword : escapeRegExp(currentSearchKeyword);
            searchRegex = new RegExp(pattern, flags);
        } catch (e) {
            return;
        }

        const lineNodes = logEl.querySelectorAll('.line');
        lineNodes.forEach((node) => {
            const text = node.textContent;
            if (!text) return;

            searchRegex.lastIndex = 0;
            let match;
            let lastIndex = 0;
            const fragment = document.createDocumentFragment();
            let hasMatch = false;

            while ((match = searchRegex.exec(text)) !== null) {
                hasMatch = true;
                const matchText = match[0];
                const matchStart = match.index;

                if (matchStart > lastIndex) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex, matchStart)));
                }

                const span = document.createElement('span');
                span.className = 'highlight';
                span.textContent = matchText;
                span.id = `match-${searchMatches.length}`;
                searchMatches.push(span);
                fragment.appendChild(span);

                lastIndex = matchStart + matchText.length;
                if (match.index === searchRegex.lastIndex) searchRegex.lastIndex++;
            }

            if (hasMatch) {
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
                node.innerHTML = '';
                node.appendChild(fragment);
            }
        });
    }

    function jumpSearchMatch(index) {
        if (searchMatches.length === 0) return;
        
        const safeIdx = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;

        const prevFocus = document.querySelector('.highlight-current');
        if (prevFocus) prevFocus.className = 'highlight';

        const currSpan = searchMatches[safeIdx];
        if (currSpan) {
            currSpan.className = 'highlight-current';
            currSpan.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }

    function clearH5Search() {
        currentSearchKeyword = '';
        searchMatches = [];
        render();
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function showRpcOutline() {
        const modal = document.getElementById('rpcModal');
        const rpcListEl = document.getElementById('rpcList');
        const lines = fullLogText.split('\n');
        rpcListEl.innerHTML = '';

        if (rpcBoundaryIndices.length === 0) {
            rpcListEl.innerHTML = '<div class="outline-item">未查找到 RPC 请求记录</div>';
        } else {
            rpcBoundaryIndices.forEach((lineIndex, index) => {
                let methodName = lines[lineIndex] || '';
                for (let offset = 1; offset <= 5 && (lineIndex + offset) < lines.length; offset++) {
                    const l = lines[lineIndex + offset].trim();
                    if (l.startsWith('Method:') || l.startsWith('method:')) {
                        methodName = l.replace(/^(Method|method):/, '').trim();
                        break;
                    }
                }

                const div = document.createElement('div');
                div.className = 'outline-item';
                div.innerHTML = `<span class="outline-tag">#${index + 1}</span> ${escapeHtml(methodName)}`;
                div.onclick = () => {
                    closeRpcOutline();
                    jumpToLine(lineIndex);
                };
                rpcListEl.appendChild(div);
            });
        }
        modal.style.display = 'flex';
    }

    function closeRpcOutline() {
        document.getElementById('rpcModal').style.display = 'none';
    }

    function jumpToLine(lineIndex) {
        const targetEl = document.getElementById(`line-${lineIndex}`);
        if (targetEl) {
            targetEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
            targetEl.style.backgroundColor = 'rgba(76, 175, 80, 0.35)';
            setTimeout(() => { targetEl.style.backgroundColor = ''; }, 2000);
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
