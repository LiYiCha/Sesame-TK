<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>Log Viewer (H5 Engine)</title>
    <style>
        /* ============================================================
           Design Tokens — 支持 Light / Dark 双模式
           ============================================================ */
        :root {
          --bg: #0f1117;
          --fg: #c9d1d9;
          --border-strong: rgba(255,255,255,0.16);
          --accent: #58a6ff;
          --accent-dim: rgba(88,166,255,0.15);
          --glass: rgba(22,27,34,0.94);
          --on-glass: #e6edf3;
          --highlight-bg: rgba(210,153,34,0.45);
          --highlight-fg: #ffffff;
          --highlight-current-bg: #d29922;
          --highlight-current-fg: #0f1117;
          --font-mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
          --text-sm: 11px;
          --leading: 1.55;
          --sp-3: 12px;
          --sp-4: 16px;
          --radius-pill: 999px;
          --shadow-lg: 0 4px 20px rgba(0,0,0,0.30);
          --shadow-xl: 0 8px 40px rgba(0,0,0,0.40);
        }

        @media (prefers-color-scheme: light) {
          :root {
            --bg: #f6f8fa;
            --fg: #1f2328;
            --border-strong: rgba(0,0,0,0.14);
            --accent: #0969da;
            --accent-dim: rgba(9,105,218,0.08);
            --glass: rgba(255,255,255,0.92);
            --on-glass: #1f2328;
            --highlight-bg: rgba(191,135,0,0.30);
            --highlight-fg: #1f2328;
            --highlight-current-bg: #bf8700;
            --highlight-current-fg: #ffffff;
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.12);
            --shadow-xl: 0 8px 40px rgba(0,0,0,0.16);
          }
        }

        /* ============================================================
           Reset & Base
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        html {
          height: 100%;
          overflow-y: scroll;
        }
        body {
          margin: 0; padding: 0;
          min-height: 100%;
          background: var(--bg); color: var(--fg);
          font-family: var(--font-mono);
          line-height: var(--leading); font-size: var(--text-sm);
          -webkit-text-size-adjust: 100%;
          scroll-behavior: smooth;
        }

        /* ============================================================
           Log Area
           ============================================================ */
        #log {
          white-space: pre-wrap; word-break: break-all;
          padding: var(--sp-4) var(--sp-3) 80px var(--sp-3);
          user-select: text; -webkit-user-select: text;
          max-width: 100%;
        }
        .line {
          min-height: 1.45em;
          padding: 1px 0;
          border-bottom: 1px solid transparent;
          transition: background-color 0.12s ease;
        }
        .line:hover { background-color: rgba(128,128,128,0.04); }

        /* 搜索高亮 */
        .highlight {
          background-color: var(--highlight-bg);
          color: var(--highlight-fg);
          font-weight: 600;
          padding: 1px 3px;
          border-radius: 3px;
        }
        .highlight-current {
          background-color: var(--highlight-current-bg);
          color: var(--highlight-current-fg);
          font-weight: 600;
          padding: 0 4px;
          border-radius: 4px;
          outline: 2px solid var(--accent);
          outline-offset: -1px;
        }

        /* 全局默认选中背景色 */
        ::selection {
          background-color: rgba(0, 120, 215, 0.4);
        }

        /* 解决“选中时高亮消失”的体验问题：让高亮词汇在被选中时呈现特殊的反差色 */
        .highlight::selection { 
          background-color: #ff5252 !important; 
          color: #fff !important; 
        }
        .highlight-current::selection { 
          background-color: #d50000 !important; 
          color: #fff !important; 
        }

        /* ============================================================
           RPC 悬浮胶囊 — Glassmorphism
           ============================================================ */
        .rpc-fab-capsule {
          position: fixed; right: 16px; bottom: 28px; z-index: 90;
          display: flex; align-items: center; gap: 0;
          background: var(--glass);
          backdrop-filter: blur(20px) saturate(180%);
          -webkit-backdrop-filter: blur(20px) saturate(180%);
          color: var(--on-glass);
          border: 1px solid var(--border-strong);
          border-radius: var(--radius-pill);
          padding: 3px 6px;
          box-shadow: var(--shadow-lg);
          transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.2s;
        }
        .rpc-fab-capsule:hover {
          border-color: var(--accent);
          box-shadow: var(--shadow-xl), 0 0 0 1px var(--accent-dim);
        }
        .rpc-fab-arrow {
          background: transparent; border: none;
          color: var(--on-glass); font-size: 13px;
          width: 32px; height: 32px;
          padding: 0; cursor: pointer; user-select: none;
          border-radius: 50%; line-height: 1;
          display: flex; align-items: center; justify-content: center;
          transition: background 0.15s, color 0.15s;
          -webkit-tap-highlight-color: transparent;
        }
        .rpc-fab-arrow:hover { background: rgba(128,128,128,0.15); }
        .rpc-fab-arrow:active { background: var(--accent-dim); color: var(--accent); transform: scale(0.93); }
        .rpc-fab-count {
          font-size: var(--text-sm); font-weight: 600;
          padding: 0 10px; cursor: pointer; user-select: none;
          color: var(--on-glass); letter-spacing: 0.4px;
          min-width: 36px; text-align: center;
          font-variant-numeric: tabular-nums;
          transition: color 0.15s;
          -webkit-tap-highlight-color: transparent;
        }
        .rpc-fab-count:hover { color: var(--accent); }
        .rpc-fab-count:active { transform: scale(0.95); }

        /* ============================================================
           Modal — 最朴素可靠的实现
           ============================================================ */
        .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.50);
          z-index: 99999;
          display: none;
          align-items: center;
          justify-content: center;
        }
        .modal-overlay.show {
          display: flex;
        }

        .modal-panel {
          display: block !important;
          visibility: visible !important;
          opacity: 1 !important;
          background-color: #1c2129 !important;
          color: #e6edf3 !important;
          border-radius: 12px;
          width: 92% !important;
          max-width: 500px;
          min-height: 360px !important;
          max-height: 82vh;
          overflow-y: auto;
          box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }
        @media (prefers-color-scheme: light) {
          .modal-overlay { background: rgba(0,0,0,0.30); }
          .modal-panel {
            background-color: #ffffff !important;
            color: #1f2328 !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14);
          }
        }

        .modal-header {
          padding: 18px 24px 14px;
          border-bottom: 1px solid rgba(128,128,128,0.20);
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 17px;
          font-weight: 700;
          font-family: var(--font-sans);
          letter-spacing: -0.01em;
        }
        @media (prefers-color-scheme: light) {
          .modal-header { border-bottom-color: rgba(0,0,0,0.10); }
        }
        .modal-close {
          background: rgba(128,128,128,0.12);
          border: none;
          color: inherit;
          font-size: 18px;
          font-weight: 600;
          width: 36px; height: 36px;
          padding: 0;
          cursor: pointer;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: background 0.15s;
          font-family: var(--font-sans);
          -webkit-tap-highlight-color: transparent;
        }
        .modal-close:hover { background: rgba(128,128,128,0.22); }
        .modal-close:active { background: rgba(128,128,128,0.30); transform: scale(0.92); }

        .modal-body {
          padding: 10px 16px 16px;
        }
        body.modal-open { overflow: hidden; }

        /* ============================================================
           大纲卡片
           ============================================================ */
        .outline-card {
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 10px;
          margin-bottom: 6px;
          cursor: pointer; user-select: none;
          transition: background 0.15s, border-color 0.15s;
          overflow: hidden;
          -webkit-tap-highlight-color: transparent;
        }
        @media (prefers-color-scheme: light) {
          .outline-card {
            background: #f6f8fa;
            border-color: rgba(0,0,0,0.08);
          }
        }
        .outline-card:hover { background: rgba(255,255,255,0.10); }
        @media (prefers-color-scheme: light) {
          .outline-card:hover { background: #eef1f5; }
        }
        .outline-card:active { background: rgba(255,255,255,0.12); transform: scale(0.985); }
        @media (prefers-color-scheme: light) {
          .outline-card:active { background: #e2e8f0; }
        }
        .outline-card.current {
          background: rgba(88,166,255,0.12);
          border-color: rgba(88,166,255,0.45);
        }
        @media (prefers-color-scheme: light) {
          .outline-card.current {
            background: #ddf4ff;
            border-color: #0969da;
          }
        }
        .outline-row {
          display: flex; align-items: center;
          padding: 10px 14px; gap: 10px;
          min-height: 44px;
        }
        .outline-idx {
          font-size: 11px; font-weight: 700;
          flex-shrink: 0;
          color: rgba(255,255,255,0.35);
          font-variant-numeric: tabular-nums;
          min-width: 24px;
          font-family: var(--font-mono);
        }
        @media (prefers-color-scheme: light) {
          .outline-idx { color: #8b949e; }
        }
        .outline-card.current .outline-idx { color: #58a6ff; }
        @media (prefers-color-scheme: light) {
          .outline-card.current .outline-idx { color: #0969da; }
        }
        .outline-method {
          font-size: 13px;
          font-family: var(--font-mono);
          color: #c9d1d9;
          flex: 1; min-width: 0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          line-height: 1.4;
        }
        @media (prefers-color-scheme: light) {
          .outline-method { color: #1f2328; }
        }
        .outline-card.current .outline-method { color: #e6edf3; }
        @media (prefers-color-scheme: light) {
          .outline-card.current .outline-method { color: #0550ae; }
        }
        .outline-empty {
          padding: 32px 18px; text-align: center;
          font-size: 13px; color: rgba(255,255,255,0.40);
          font-family: var(--font-sans);
        }
        @media (prefers-color-scheme: light) {
          .outline-empty { color: #8b949e; }
        }

            </style>
</head>
<body>

<div id="log"></div>

<!-- RPC 悬浮胶囊 -->
<div id="rpcNavigator" class="rpc-fab-capsule" style="display:none">
    <button class="rpc-fab-arrow" onclick="prevRpcMatch()" aria-label="上一个RPC请求">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <span id="rpcCountText" class="rpc-fab-count" onclick="showRpcOutline()">0/0</span>
    <button class="rpc-fab-arrow" onclick="nextRpcMatch()" aria-label="下一个RPC请求">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
</div>

<!-- RPC 大纲 Modal（标准绝对居中方案） -->
<div id="rpcModal" class="modal-overlay" onclick="closeRpcOutline()">
    <div class="modal-panel" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span>RPC 请求大纲</span>
            <button class="modal-close" onclick="closeRpcOutline()" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body" id="rpcList"></div>
    </div>
</div>

<script>
    const logEl = document.getElementById('log');
    const rpcNavEl = document.getElementById('rpcNavigator');
    const rpcCountText = document.getElementById('rpcCountText');

    let fullLogText = '';
    let currentSearchKeyword = '';
    let currentIsCaseSensitive = false;
    let currentIsRegex = false;
    let searchMatches = [];
    let rpcBoundaryIndices = [];
    let currentRpcIndex = -1;
    let autoScrollEnabled = true;

    // ============================================================
    //  滚动监听 — 实时更新当前 RPC 位置计数器
    // ============================================================
    let isTicking = false;

    function updateCurrentRpcCounter() {
        if (rpcBoundaryIndices.length === 0) {
            rpcCountText.textContent = '0/0';
            currentRpcIndex = -1;
            return;
        }
        const total = rpcBoundaryIndices.length;
        const idx = currentRpcIndex >= 0 ? currentRpcIndex : 0;
        rpcCountText.textContent = (idx + 1) + '/' + total;
    }

    function onScrollHandler() {
        rpcNavEl.style.opacity = '1';
        rpcNavEl.style.transform = 'translateY(0)';
        updateCurrentRpcCounter();
        isTicking = false;
    }

    window.addEventListener('scroll', () => {
        if (!isTicking) {
            window.requestAnimationFrame(onScrollHandler);
            isTicking = true;
        }
    }, { passive: true });

    // ============================================================
    //  RPC 前后跳转
    // ============================================================
    function prevRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        let target = currentRpcIndex - 1;
        if (target < 0) target = rpcBoundaryIndices.length - 1;
        currentRpcIndex = target;
        jumpToRpcLine(rpcBoundaryIndices[target]);
        updateCurrentRpcCounter();
    }

    function nextRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        let target = currentRpcIndex + 1;
        if (target >= rpcBoundaryIndices.length) target = 0;
        currentRpcIndex = target;
        jumpToRpcLine(rpcBoundaryIndices[target]);
        updateCurrentRpcCounter();
    }

    function jumpToRpcLine(lineIndex) {
        const targetEl = document.getElementById('line-' + lineIndex);
        if (targetEl) {
            targetEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
            targetEl.style.backgroundColor = 'rgba(76, 175, 80, 0.25)';
            setTimeout(() => { targetEl.style.backgroundColor = ''; }, 1800);
        }
    }

    // ============================================================
    //  初始化 & 数据加载
    // ============================================================
    let isFetching = false;

    function initLogBridge() {
        if (isFetching) return;
        isFetching = true;
        fetch('https://appassets.androidplatform.net/logdata/stream')
            .then(response => {
                if (!response.ok) throw new Error('日志流读取异常 ' + response.status);
                return response.text();
            })
            .then(text => {
                isFetching = false;
                fullLogText = text;
                // 非抓包日志（不含 ========================> 标记）不显示 RPC 胶囊
                if (!text.includes('========================>')) {
                    rpcNavEl.style.display = 'none';
                }
                render();
            })
            .catch(err => {
                isFetching = false;
                console.error('WebViewAssetLoader 同源流读取失败:', err);
                logEl.innerHTML = '<div class="line" style="color:red;padding:16px;">日志流加载异常，请尝试切换至 Compose 视图查看</div>';
            });
    }

    // ============================================================
    //  分块渲染（含 RPC 边界检测）
    // ============================================================
    let renderTaskId = 0;

    function render() {
        if (!fullLogText) {
            logEl.innerHTML = '';
            rpcNavEl.style.display = 'none';
            return;
        }

        const lines = fullLogText.split('\n');
        rpcBoundaryIndices = [];
        logEl.innerHTML = '';

        const totalLines = lines.length;
        let currentIndex = 0;
        const currentTaskId = ++renderTaskId;

        function renderNextChunk() {
            if (currentTaskId !== renderTaskId) return;

            const startTime = performance.now();
            const fragment = document.createDocumentFragment();

            while (currentIndex < totalLines) {
                const lineText = lines[currentIndex];
                if (lineText.includes('Method:') || lineText.includes('method:')) {
                    if (!rpcBoundaryIndices.includes(currentIndex)) {
                        rpcBoundaryIndices.push(currentIndex);
                    }
                }
                const div = document.createElement('div');
                div.className = 'line';
                div.id = 'line-' + currentIndex;
                div.textContent = lineText;
                fragment.appendChild(div);
                currentIndex++;

                if (performance.now() - startTime >= 8) break;
            }

            logEl.appendChild(fragment);

            if (currentIndex < totalLines) {
                setTimeout(renderNextChunk, 0);
            } else {
                if (rpcBoundaryIndices.length > 0) {
                    rpcNavEl.style.display = 'flex';
                    currentRpcIndex = 0;
                    updateCurrentRpcCounter();
                } else {
                    rpcNavEl.style.display = 'none';
                }

                if (currentSearchKeyword) {
                    highlightKeyword(currentSearchKeyword, currentIsCaseSensitive, currentIsRegex);
                }
            }
        }

        renderNextChunk();
    }

    function setFullText(text) {
        fullLogText = text || '';
        render();
    }

    // ============================================================
    //  增量追加 & 自动滚动
    // ============================================================
    function appendLog(newText) {
        if (!newText || typeof newText !== 'string') return;
        const newLines = newText.split('\n');
        const fragment = document.createDocumentFragment();
        const startLineIdx = logEl.children.length;

        for (let i = 0; i < newLines.length; i++) {
            const lineText = newLines[i];
            const currentLineId = startLineIdx + i;
            if (lineText.includes('Method:') || lineText.includes('method:')) {
                if (!rpcBoundaryIndices.includes(currentLineId)) {
                    rpcBoundaryIndices.push(currentLineId);
                }
            }
            const div = document.createElement('div');
            div.className = 'line';
            div.id = 'line-' + currentLineId;
            div.textContent = lineText;
            fragment.appendChild(div);
        }

        logEl.appendChild(fragment);

        // DOM 容量保护：超过 50000 行则裁剪，同时修正 RPC 索引偏移
        while (logEl.children.length > 50000) {
            const removed = logEl.firstElementChild;
            if (removed && removed.id && removed.id.startsWith('line-')) {
                const rmIdx = parseInt(removed.id.slice(5), 10);
                rpcBoundaryIndices = rpcBoundaryIndices
                    .filter(idx => idx !== rmIdx)
                    .map(idx => idx > rmIdx ? idx - 1 : idx);
            }
            logEl.removeChild(removed);
        }

        if (rpcBoundaryIndices.length > 0) {
            rpcNavEl.style.display = 'flex';
            updateCurrentRpcCounter();
        }

        if (currentSearchKeyword) {
            highlightKeyword(currentSearchKeyword, currentIsCaseSensitive, currentIsRegex);
        }

        // 自动滚动
        if (autoScrollEnabled) {
            requestAnimationFrame(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
            });
        }
    }

    function setAutoScroll(enabled) {
        autoScrollEnabled = !!enabled;
    }

    // ============================================================
    //  搜索高亮
    // ============================================================
    function highlightKeyword(keyword, isCaseSensitive, isRegex) {
        currentSearchKeyword = keyword || '';
        currentIsCaseSensitive = !!isCaseSensitive;
        currentIsRegex = !!isRegex;
        searchMatches = [];

        if (!currentSearchKeyword) {
            render();
            return;
        }

        let searchRegex;
        try {
            const flags = isCaseSensitive ? 'g' : 'gi';
            const pattern = isRegex ? currentSearchKeyword : escapeRegExp(currentSearchKeyword);
            searchRegex = new RegExp(pattern, flags);
        } catch (e) { return; }

        const lineNodes = logEl.querySelectorAll('.line');
        lineNodes.forEach((node) => {
            const text = node.textContent;
            if (!text) return;
            searchRegex.lastIndex = 0;
            let match;
            let lastIndex = 0;
            const fragment = document.createDocumentFragment();
            let hasMatch = false;
            while ((match = searchRegex.exec(text)) !== null) {
                hasMatch = true;
                const matchText = match[0];
                const matchStart = match.index;
                if (matchStart > lastIndex) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex, matchStart)));
                }
                const span = document.createElement('span');
                span.className = 'highlight';
                span.textContent = matchText;
                span.id = 'match-' + searchMatches.length;
                searchMatches.push(span);
                fragment.appendChild(span);
                lastIndex = matchStart + matchText.length;
                if (match.index === searchRegex.lastIndex) searchRegex.lastIndex++;
            }
            if (hasMatch) {
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
                node.innerHTML = '';
                node.appendChild(fragment);
            }
        });
    }

    function jumpSearchMatch(index) {
        if (searchMatches.length === 0) return;
        const safeIdx = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;
        const prevFocus = document.querySelector('.highlight-current');
        if (prevFocus) prevFocus.className = 'highlight';
        const currSpan = searchMatches[safeIdx];
        if (currSpan) {
            currSpan.className = 'highlight-current';
            currSpan.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }

    function clearH5Search() {
        currentSearchKeyword = '';
        searchMatches = [];
        render();
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // ============================================================
    //  RPC 大纲 Modal
    // ============================================================
    function showRpcOutline() {
        const modal = document.getElementById('rpcModal');
        const rpcListEl = document.getElementById('rpcList');
        const lines = fullLogText.split('\n');
        rpcListEl.innerHTML = '';

        if (rpcBoundaryIndices.length === 0) {
            rpcListEl.innerHTML = '<div class="outline-empty">未查找到 RPC 请求记录</div>';
        } else {
            rpcBoundaryIndices.forEach((lineIndex, index) => {
                let methodName = '';
                for (let offset = 0; offset <= 5 && (lineIndex + offset) < lines.length; offset++) {
                    const l = lines[lineIndex + offset];
                    const m = l.match(/^(?:Method|method):\s*(.+)/);
                    if (m) {
                        methodName = m[1].trim();
                        break;
                    }
                }
                if (!methodName) {
                    const raw = lines[lineIndex].trim();
                    methodName = raw.length > 80 ? raw.substring(0, 80) + '…' : raw;
                }

                const isCurrent = (index === currentRpcIndex);
                const card = document.createElement('div');
                card.className = 'outline-card' + (isCurrent ? ' current' : '');
                card.innerHTML =
                    '<div class="outline-row">' +
                    '<span class="outline-idx">[' + (index + 1) + ']</span>' +
                    '<span class="outline-method" title="' + escapeHtml(methodName) + '">' + escapeHtml(methodName) + '</span>' +
                    '</div>';
                card.onclick = () => {
                    closeRpcOutline();
                    currentRpcIndex = index;
                    jumpToRpcLine(lineIndex);
                    updateCurrentRpcCounter();
                };
                rpcListEl.appendChild(card);
            });
        }
        modal.classList.add('show');
        document.body.classList.add('modal-open');
    }

    function closeRpcOutline() {
        document.getElementById('rpcModal').classList.remove('show');
        document.body.classList.remove('modal-open');
    }

    function jumpToLine(lineIndex) {
        jumpToRpcLine(lineIndex);
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 页面加载完成即启动流式加载
    initLogBridge();
</script>
</body>
