<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>Log Viewer (H5 Engine)</title>
    <style>
        :root {
          --bg: #0b0b0c;
          --fg: #e6e6e6;
          --border: rgba(255,255,255,0.12);
          --accent: #4caf50;
          --surface: #1a1a1d;
          --glass: rgba(26, 26, 29, 0.92);
          --on-glass: #f0f0f0;
        }
        @media (prefers-color-scheme: light) {
          :root {
            --bg: #ffffff;
            --fg: #1f1f1f;
            --border: rgba(0,0,0,0.12);
            --accent: #2e7d32;
            --surface: #f5f5f5;
            --glass: rgba(255,255,255,0.92);
            --on-glass: #1f1f1f;
          }
        }

        html, body {
          margin: 0; padding: 0;
          background: var(--bg); color: var(--fg);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
          line-height: 1.35; font-size: 9px;
          -webkit-text-size-adjust: 100%;
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
        }

        #log {
          white-space: pre-wrap; word-break: break-all;
          padding: 8px 12px 70px 8px;
          user-select: text; -webkit-user-select: text;
        }
        .line { min-height: 1.25em; }
        .highlight { background-color: #ffd54f; color: #000; font-weight: bold; padding: 0 2px; border-radius: 2px; }
        .highlight-current { background-color: #ff9800; color: #fff; font-weight: bold; padding: 0 2px; border-radius: 2px; outline: 2px solid #ff5722; }

        /* ===== RPC 悬浮胶囊 ===== */
        .rpc-fab-capsule {
          position: fixed; right: 14px; bottom: 24px; z-index: 90;
          display: flex; align-items: center; gap: 0;
          background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
          color: var(--on-glass);
          border: 1px solid var(--border); border-radius: 28px;
          padding: 2px 4px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.35);
          transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .rpc-fab-arrow {
          background: transparent; border: none;
          color: var(--on-glass); font-size: 12px;
          padding: 6px 8px; cursor: pointer; user-select: none;
          border-radius: 50%; line-height: 1;
          transition: background 0.15s;
        }
        .rpc-fab-arrow:active { background: rgba(255,255,255,0.12); color: var(--accent); }
        .rpc-fab-count {
          font-size: 11px; font-weight: 600;
          padding: 0 8px; cursor: pointer; user-select: none;
          color: var(--on-glass); letter-spacing: 0.3px;
        }

        /* ===== Modal 玻璃面板 ===== */
        .modal {
          display: none; position: fixed; inset: 0; z-index: 200;
          background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
          align-items: center; justify-content: center;
        }
        .modal.show {
          display: flex;
          animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
          from { opacity: 0; }
          to   { opacity: 1; }
        }
        .modal-content {
          background: var(--surface); color: var(--fg);
          border-radius: 28px;
          width: 92%; max-width: 520px; max-height: 78vh;
          display: flex; flex-direction: column;
          box-shadow: 0 24px 48px rgba(0,0,0,0.6);
          animation: panelIn 0.22s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        @keyframes panelIn {
          from { transform: scale(0.94); opacity: 0; }
          to   { transform: scale(1);    opacity: 1; }
        }
        .modal-header {
          padding: 18px 24px 14px;
          display: flex; justify-content: space-between; align-items: center;
          font-size: 16px; font-weight: 600;
        }
        .modal-close {
          background: transparent; border: none;
          color: var(--fg); font-size: 20px; padding: 4px 8px;
          cursor: pointer; border-radius: 50%;
          opacity: 0.55; transition: opacity 0.15s;
        }
        .modal-close:active { opacity: 1; background: rgba(128,128,128,0.15); }
        .modal-body { padding: 0 16px 16px; overflow-y: auto; flex: 1; }

        /* ===== 大纲 Card 列表项（对齐 Compose CardDefaults） ===== */
        .outline-card {
          background: var(--bg);
          border: 1px solid transparent;
          border-radius: 12px;
          margin-bottom: 6px;
          cursor: pointer; user-select: none;
          transition: border-color 0.15s, background 0.15s;
          overflow: hidden;
        }
        .outline-card:active { filter: brightness(1.1); }
        .outline-card.current {
          background: rgba(76, 175, 80, 0.12);
          border-color: var(--accent);
        }
        .outline-row {
          display: flex; align-items: center;
          padding: 10px 14px; gap: 10px;
          min-height: 44px;
        }
        .outline-idx {
          font-size: 12px; font-weight: 700;
          flex-shrink: 0;
          color: rgba(255,255,255,0.5);
        }
        .outline-card.current .outline-idx { color: var(--accent); }
        .outline-method {
          font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          color: var(--fg); flex: 1; min-width: 0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          line-height: 1.3;
        }
        .outline-card.current .outline-method { color: #c8e6c9; }
        .outline-empty {
          padding: 32px 18px; text-align: center;
          font-size: 13px; color: rgba(128,128,128,0.7);
        }
    </style>
</head>
<body>

<div id="log"></div>

<!-- RPC 悬浮胶囊 -->
<div id="rpcNavigator" class="rpc-fab-capsule">
    <button class="rpc-fab-arrow" onclick="prevRpcMatch()">▲</button>
    <span id="rpcCountText" class="rpc-fab-count" onclick="showRpcOutline()">0/0</span>
    <button class="rpc-fab-arrow" onclick="nextRpcMatch()">▼</button>
</div>

<!-- RPC 大纲 Modal -->
<div id="rpcModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>RPC 请求大纲列表</span>
            <button class="modal-close" onclick="closeRpcOutline()">✕</button>
        </div>
        <div class="modal-body" id="rpcList"></div>
    </div>
</div>

<script>
    const logEl = document.getElementById('log');
    const rpcNavEl = document.getElementById('rpcNavigator');
    const rpcCountText = document.getElementById('rpcCountText');

    let fullLogText = '';
    let currentSearchKeyword = '';
    let currentIsCaseSensitive = false;
    let currentIsRegex = false;
    let searchMatches = [];
    let rpcBoundaryIndices = [];
    let currentRpcIndex = -1;
    let autoScrollEnabled = true;

    // ============================================================
    //  滚动监听 — 实时更新当前 RPC 位置计数器
    // ============================================================
    let lastScrollY = window.scrollY;
    let isTicking = false;

    function updateCurrentRpcCounter() {
        if (rpcBoundaryIndices.length === 0) {
            rpcCountText.textContent = '0/0';
            currentRpcIndex = -1;
            return;
        }
        const viewTop = window.scrollY;
        const viewBottom = viewTop + window.innerHeight;
        const total = rpcBoundaryIndices.length;

        // 找到当前视口内最近的 RPC
        let closest = 0;
        let minDist = Infinity;
        for (let i = 0; i < total; i++) {
            const lineIdx = rpcBoundaryIndices[i];
            const el = document.getElementById('line-' + lineIdx);
            if (!el) continue;
            const elTop = el.offsetTop;
            const elBottom = elTop + el.offsetHeight;
            const elCenter = (elTop + elBottom) / 2;
            const dist = Math.abs((viewTop + viewBottom) / 2 - elCenter);
            if (dist < minDist) { minDist = dist; closest = i; }
            if (elTop > viewBottom) break;
        }
        currentRpcIndex = closest;
        rpcCountText.textContent = (closest + 1) + '/' + total;
    }

    function onScrollHandler() {
        rpcNavEl.style.opacity = '1';
        rpcNavEl.style.transform = 'translateY(0)';
        updateCurrentRpcCounter();
        isTicking = false;
    }

    window.addEventListener('scroll', () => {
        if (!isTicking) {
            window.requestAnimationFrame(onScrollHandler);
            isTicking = true;
        }
    }, { passive: true });

    // ============================================================
    //  RPC 前后跳转
    // ============================================================
    function prevRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        let target = currentRpcIndex - 1;
        if (target < 0) target = rpcBoundaryIndices.length - 1;
        currentRpcIndex = target;
        jumpToRpcLine(rpcBoundaryIndices[target]);
        updateCurrentRpcCounter();
    }

    function nextRpcMatch() {
        if (rpcBoundaryIndices.length === 0) return;
        let target = currentRpcIndex + 1;
        if (target >= rpcBoundaryIndices.length) target = 0;
        currentRpcIndex = target;
        jumpToRpcLine(rpcBoundaryIndices[target]);
        updateCurrentRpcCounter();
    }

    function jumpToRpcLine(lineIndex) {
        const targetEl = document.getElementById('line-' + lineIndex);
        if (targetEl) {
            targetEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
            targetEl.style.backgroundColor = 'rgba(76, 175, 80, 0.25)';
            setTimeout(() => { targetEl.style.backgroundColor = ''; }, 1800);
        }
    }

    // ============================================================
    //  初始化 & 数据加载
    // ============================================================
    let isFetching = false;

    function initLogBridge() {
        if (isFetching) return;
        isFetching = true;
        fetch('https://appassets.androidplatform.net/logdata/stream')
            .then(response => {
                if (!response.ok) throw new Error('日志流读取异常 ' + response.status);
                return response.text();
            })
            .then(text => {
                isFetching = false;
                fullLogText = text;
                render();
            })
            .catch(err => {
                isFetching = false;
                console.error('WebViewAssetLoader 同源流读取失败:', err);
                logEl.innerHTML = '<div class="line" style="color:red;padding:16px;">日志流加载异常，请尝试切换至 Compose 视图查看</div>';
            });
    }

    // ============================================================
    //  分块渲染（含 RPC 边界检测）
    // ============================================================
    let renderTaskId = 0;

    function render() {
        if (!fullLogText) {
            logEl.innerHTML = '';
            rpcNavEl.style.display = 'none';
            return;
        }

        const lines = fullLogText.split('\n');
        rpcBoundaryIndices = [];
        logEl.innerHTML = '';

        const totalLines = lines.length;
        let currentIndex = 0;
        const currentTaskId = ++renderTaskId;

        function renderNextChunk() {
            if (currentTaskId !== renderTaskId) return;

            const startTime = performance.now();
            const fragment = document.createDocumentFragment();

            while (currentIndex < totalLines) {
                const lineText = lines[currentIndex];
                if (/={5,}.*>/.test(lineText) || lineText.includes('Method:') || lineText.includes('method:')) {
                    if (!rpcBoundaryIndices.includes(currentIndex)) {
                        rpcBoundaryIndices.push(currentIndex);
                    }
                }
                const div = document.createElement('div');
                div.className = 'line';
                div.id = 'line-' + currentIndex;
                div.textContent = lineText;
                fragment.appendChild(div);
                currentIndex++;

                if (performance.now() - startTime >= 8) break;
            }

            logEl.appendChild(fragment);

            if (currentIndex < totalLines) {
                setTimeout(renderNextChunk, 0);
            } else {
                if (rpcBoundaryIndices.length > 0) {
                    rpcNavEl.style.display = 'flex';
                    currentRpcIndex = 0;
                    updateCurrentRpcCounter();
                } else {
                    rpcNavEl.style.display = 'none';
                }

                if (currentSearchKeyword) {
                    highlightKeyword(currentSearchKeyword, currentIsCaseSensitive, currentIsRegex);
                }

                // 自动滚动到底部
                if (autoScrollEnabled) {
                    requestAnimationFrame(() => {
                        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
                    });
                }
            }
        }

        renderNextChunk();
    }

    function setFullText(text) {
        fullLogText = text || '';
        render();
    }

    // ============================================================
    //  增量追加 & 自动滚动
    // ============================================================
    function appendLog(newText) {
        if (!newText || typeof newText !== 'string') return;
        const newLines = newText.split('\n');
        const fragment = document.createDocumentFragment();
        const startLineIdx = logEl.children.length;

        for (let i = 0; i < newLines.length; i++) {
            const lineText = newLines[i];
            const currentLineId = startLineIdx + i;
            if (/={5,}.*>/.test(lineText) || lineText.includes('Method:') || lineText.includes('method:')) {
                if (!rpcBoundaryIndices.includes(currentLineId)) {
                    rpcBoundaryIndices.push(currentLineId);
                }
            }
            const div = document.createElement('div');
            div.className = 'line';
            div.id = 'line-' + currentLineId;
            div.textContent = lineText;
            fragment.appendChild(div);
        }

        logEl.appendChild(fragment);

        // DOM 容量保护：超过 50000 行则裁剪，同时修正 RPC 索引偏移
        while (logEl.children.length > 50000) {
            const removed = logEl.firstElementChild;
            if (removed && removed.id && removed.id.startsWith('line-')) {
                const rmIdx = parseInt(removed.id.slice(5), 10);
                rpcBoundaryIndices = rpcBoundaryIndices
                    .filter(idx => idx !== rmIdx)
                    .map(idx => idx > rmIdx ? idx - 1 : idx);
            }
            logEl.removeChild(removed);
        }

        if (rpcBoundaryIndices.length > 0) {
            rpcNavEl.style.display = 'flex';
            updateCurrentRpcCounter();
        }

        if (currentSearchKeyword) {
            highlightKeyword(currentSearchKeyword, currentIsCaseSensitive, currentIsRegex);
        }

        // 自动滚动
        if (autoScrollEnabled) {
            requestAnimationFrame(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
            });
        }
    }

    function setAutoScroll(enabled) {
        autoScrollEnabled = !!enabled;
    }

    // ============================================================
    //  搜索高亮
    // ============================================================
    function highlightKeyword(keyword, isCaseSensitive, isRegex) {
        currentSearchKeyword = keyword || '';
        currentIsCaseSensitive = !!isCaseSensitive;
        currentIsRegex = !!isRegex;
        searchMatches = [];

        if (!currentSearchKeyword) {
            render();
            return;
        }

        let searchRegex;
        try {
            const flags = isCaseSensitive ? 'g' : 'gi';
            const pattern = isRegex ? currentSearchKeyword : escapeRegExp(currentSearchKeyword);
            searchRegex = new RegExp(pattern, flags);
        } catch (e) { return; }

        const lineNodes = logEl.querySelectorAll('.line');
        lineNodes.forEach((node) => {
            const text = node.textContent;
            if (!text) return;
            searchRegex.lastIndex = 0;
            let match;
            let lastIndex = 0;
            const fragment = document.createDocumentFragment();
            let hasMatch = false;
            while ((match = searchRegex.exec(text)) !== null) {
                hasMatch = true;
                const matchText = match[0];
                const matchStart = match.index;
                if (matchStart > lastIndex) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex, matchStart)));
                }
                const span = document.createElement('span');
                span.className = 'highlight';
                span.textContent = matchText;
                span.id = 'match-' + searchMatches.length;
                searchMatches.push(span);
                fragment.appendChild(span);
                lastIndex = matchStart + matchText.length;
                if (match.index === searchRegex.lastIndex) searchRegex.lastIndex++;
            }
            if (hasMatch) {
                if (lastIndex < text.length) {
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                }
                node.innerHTML = '';
                node.appendChild(fragment);
            }
        });
    }

    function jumpSearchMatch(index) {
        if (searchMatches.length === 0) return;
        const safeIdx = ((index % searchMatches.length) + searchMatches.length) % searchMatches.length;
        const prevFocus = document.querySelector('.highlight-current');
        if (prevFocus) prevFocus.className = 'highlight';
        const currSpan = searchMatches[safeIdx];
        if (currSpan) {
            currSpan.className = 'highlight-current';
            currSpan.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
    }

    function clearH5Search() {
        currentSearchKeyword = '';
        searchMatches = [];
        render();
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // ============================================================
    //  RPC 大纲 Modal
    // ============================================================
    function showRpcOutline() {
        const modal = document.getElementById('rpcModal');
        const rpcListEl = document.getElementById('rpcList');
        const lines = fullLogText.split('\n');
        rpcListEl.innerHTML = '';

        if (rpcBoundaryIndices.length === 0) {
            rpcListEl.innerHTML = '<div class="outline-empty">未查找到 RPC 请求记录</div>';
        } else {
            rpcBoundaryIndices.forEach((lineIndex, index) => {
                let methodName = '';
                for (let offset = 0; offset <= 5 && (lineIndex + offset) < lines.length; offset++) {
                    const l = lines[lineIndex + offset];
                    const m = l.match(/^(?:Method|method):\s*(.+)/);
                    if (m) {
                        methodName = m[1].trim();
                        break;
                    }
                }
                if (!methodName) {
                    const raw = lines[lineIndex].trim();
                    methodName = raw.length > 80 ? raw.substring(0, 80) + '…' : raw;
                }

                const isCurrent = (index === currentRpcIndex);
                const card = document.createElement('div');
                card.className = 'outline-card' + (isCurrent ? ' current' : '');
                card.innerHTML =
                    '<div class="outline-row">' +
                    '<span class="outline-idx">[' + (index + 1) + ']</span>' +
                    '<span class="outline-method" title="' + escapeHtml(methodName) + '">' + escapeHtml(methodName) + '</span>' +
                    '</div>';
                card.onclick = () => {
                    closeRpcOutline();
                    currentRpcIndex = index;
                    jumpToRpcLine(lineIndex);
                    updateCurrentRpcCounter();
                };
                rpcListEl.appendChild(card);
            });
        }
        modal.classList.add('show');
    }

    function closeRpcOutline() {
        document.getElementById('rpcModal').classList.remove('show');
    }

    function jumpToLine(lineIndex) {
        jumpToRpcLine(lineIndex);
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 页面加载完成即启动流式加载
    initLogBridge();
</script>
</body>
</html>
