<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <title>Log Viewer</title>
    <style>
        :root {
          --bg: #0b0b0c;
          --fg: #e6e6e6;
          --muted: #9aa0a6;
          --border: rgba(255,255,255,0.15);
        }
        @media (prefers-color-scheme: light) {
          :root {
            --bg: #ffffff;
            --fg: #1f1f1f;
            --muted: #666;
            --border: rgba(0,0,0,0.15);
          }
        }
        html, body {
          margin: 0;
          padding: 0;
          background: var(--bg);
          color: var(--fg);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
          line-height: 1.4;
          -webkit-text-size-adjust: 100%;
        }
        #toolbar { position: sticky; top: 0; background: rgba(0,0,0,0.08); backdrop-filter: blur(4px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
        .toolbar-row { padding: 8px 12px; display: flex; gap: 12px; align-items: center; }
        .toolbar-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .input { flex: 1; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); font-size: 12px; }
        #log { white-space: pre-wrap; word-break: break-word; padding: 5px; font-size: 10px; padding-top: 130px; }
        button, label { color: var(--fg); background: transparent; border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-size: 12px; }
        button:hover { border-color: rgba(255,255,255,0.3); }
        .muted { color: var(--muted); font-size: 12px; margin-left: auto; }
        input[type="checkbox"] { vertical-align: middle;
        }
        #searchPrevBtn, #searchNextBtn {
            min-width: 30px;
            padding: 4px 8px;
        }
        .highlight {
            background-color: yellow;
            color: red;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .toolbar-row {
                flex-wrap: wrap;
            }
            .input {
                min-width: 120px;
            }
        }

        #searchStatus {
            white-space: nowrap;
        }



    </style>
</head>
<body>
<div id="toolbar">
    <!-- 第一行：基础功能 -->
    <div class="toolbar-row">
        <label><input type="checkbox" id="autoScroll" checked /> 自动滚动到底部</label>
        <button onclick="clearLog()">清空显示</button>
        <button onclick="toggleSearchPanel()">搜索</button>
        <span class="muted" id="status">就绪</span>
    </div>
    <!-- 第二行：筛选功能 -->
    <div class="toolbar-row">
        <input type="text" id="filterInput" class="input" placeholder="输入关键字筛选..." />
        <button onclick="applyFilter()">筛选</button>
        <button onclick="clearFilter()">清除筛选</button>
    </div>
    <!-- 第三行：搜索功能（默认隐藏） -->
    <div class="toolbar-row" id="searchPanel" style="display: none;">
        <input type="text" id="searchInput" class="input" placeholder="输入关键字搜索..." />
        <button onclick="performSearch()">搜索</button>
        <div style="display: flex; gap: 4px;">
            <button id="searchPrevBtn" onclick="searchPrev()" title="上一个">&#8593;</button>
            <button id="searchNextBtn" onclick="searchNext()" title="下一个">&#8595;</button>
        </div>
        <button onclick="clearSearch()">清除</button>
        <span class="muted" id="searchStatus" style="min-width: 40px; text-align: center;"></span>
    </div>


</div>

<!--日志内容-->
<div id="log"></div>

<script>
    const logEl = document.getElementById('log');
    const autoScrollEl = document.getElementById('autoScroll');
    const statusEl = document.getElementById('status');
    const filterInputEl = document.getElementById('filterInput');
    const searchStatusEl = document.getElementById('searchStatus');

    let fullLogText = ''; // 完整日志
    let currentFilter = ''; // 当前筛选关键字
    let currentSearch = ''; // 当前搜索关键字
    let searchResults = [];  // 搜索结果
    let currentResultIndex = -1; // 当前搜索结果索引
    let searchPanelVisible = false; // 搜索面板是否可见
    let displayedIndexMap = new Map(); // 原始行索引 -> 可见行索引映射

    function _scrollToBottom() {
      if (!autoScrollEl.checked) return;
      // 只在没有进行搜索时才自动滚动到底部
      if (!currentSearch) {
        window.scrollTo(0, document.body.scrollHeight);
      }
    }

    function render() {
        const lines = fullLogText.split('\n');
        let base = [];
        displayedIndexMap = new Map();
        // 构建可见列表与索引映射（避免重复行导致的错位）
        for (let i = 0, di = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!currentFilter || line.includes(currentFilter)) {
                base.push(line);
                displayedIndexMap.set(i, di);
                di++;
            }
        }

        // 清空容器
        logEl.innerHTML = '';

        // 重新构建DOM元素
        base.forEach((line) => {
            const lineDiv = document.createElement('div');
            lineDiv.innerHTML = escapeHtml(line);
            logEl.appendChild(lineDiv);
        });

        // 重新应用搜索高亮
        if (currentSearch && searchResults.length > 0) {
            applyHighlights();
        }

        const total = lines.length;
        const filteredCount = base.length;
        if (currentFilter) {
            statusEl.textContent = `筛选结果: ${filteredCount}/${total} 行`;
        } else {
            statusEl.textContent = '就绪';
        }
        _scrollToBottom();
    }



    function setFullText(text) {
      fullLogText = text || '';
      render();
    }

    function appendLog(chunk) {
      if (!chunk) return;
      fullLogText += chunk;
      render();
    }

    function clearLog() {
      fullLogText = '';
      logEl.textContent = '';
      statusEl.textContent = '已清空显示';
      currentFilter = '';
      currentSearch = '';
      filterInputEl.value = '';
    }

    function applyFilter() {
      const keyword = filterInputEl.value.trim();
      if (!keyword) { clearFilter(); return; }
      currentFilter = keyword;
      render();
    }

    function clearFilter() {
      currentFilter = '';
      filterInputEl.value = '';
      render();
    }

    // 搜索功能
    function toggleSearchPanel() {
        const searchPanel = document.getElementById('searchPanel');
        searchPanelVisible = !searchPanelVisible;
        searchPanel.style.display = searchPanelVisible ? 'flex' : 'none';

        if (!searchPanelVisible) {
            clearSearch();
        }
    }

    // 获取元素在页面中的位置
    function getElementPosition(element) {
        const rect = element.getBoundingClientRect();
        return rect.top + window.pageYOffset;
    }

    // 查找距离当前滚动位置最近的搜索结果
    function findNearestResult() {
        if (searchResults.length === 0) return -1;
        const currentScrollPosition = window.pageYOffset;
        let nearestIndex = -1;
        let minDistance = Infinity;
        const logLines = logEl.children;

        for (let i = 0; i < searchResults.length; i++) {
            const result = searchResults[i];
            const displayIndex = displayedIndexMap.get(result.lineIndex);
            if (displayIndex === undefined || displayIndex >= logLines.length) continue;
            const element = logLines[displayIndex];
            const elementPosition = getElementPosition(element);
            const distance = Math.abs(elementPosition - currentScrollPosition);
            if (distance < minDistance) {
                minDistance = distance;
                nearestIndex = i;
            }
        }
        return nearestIndex;
    }

    function performSearch() {
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput.value.trim();
        if (!keyword) return;

        // 如果是新的搜索关键字，则重新搜索
        if (currentSearch !== keyword) {
            currentSearch = keyword;
            searchResults = [];
            currentResultIndex = -1;

            const lines = fullLogText.split('\n');
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // 默认忽略大小写
                const searchText = line.toLowerCase();
                const searchKeyword = keyword.toLowerCase();
                
                let index = searchText.indexOf(searchKeyword);
                while (index !== -1) {
                    // 添加结果索引以便定位
                    searchResults.push({
                        lineIndex: i,
                        charIndex: index
                    });
                    index = searchText.indexOf(searchKeyword, index + 1);
                }
            }
            
            // 设置默认的当前结果索引为第一个匹配项
            if (searchResults.length > 0) {
                currentResultIndex = 0;
            }
        } else {
            // 如果是相同关键字且已有结果，不进行任何操作
            // 让用户使用 searchNext/searchPrev 来导航
            if (searchResults.length > 0) {
                updateSearchStatus();
                return;
            }
        }

        render(); // 重新渲染以应用高亮
        updateSearchStatus();
    }

    // 应用高亮
    function applyHighlights() {
        if (!currentSearch || searchResults.length === 0) return;
        const logLines = logEl.children;
        const perLine = {};
        // 仅组织可见行的结果
        searchResults.forEach((res, idx) => {
            const displayIndex = displayedIndexMap.get(res.lineIndex);
            if (displayIndex === undefined || displayIndex >= logLines.length) return;
            if (!perLine[displayIndex]) perLine[displayIndex] = [];
            perLine[displayIndex].push({
                charIndex: res.charIndex,
                isCurrent: idx === currentResultIndex
            });
        });
        // 应用高亮
        Object.keys(perLine).forEach(diStr => {
            const di = parseInt(diStr);
            const lineElement = logLines[di];
            const lineText = lineElement.textContent;
            const highlightedHTML = highlightLineTextNew(lineText, perLine[di], currentSearch);
            lineElement.innerHTML = highlightedHTML;
        });

        // 使用 setTimeout 确保 DOM 更新完成后再滚动
        setTimeout(() => {
            scrollToCurrentResult();
        }, 10);
    }

    // 高亮行文本中的所有匹配项
    function highlightLineTextNew(lineText, results, keyword) {
        if (!keyword || results.length === 0) return escapeHtml(lineText);

        let result = '';
        let lastIndex = 0;

        // 按字符索引排序结果
        results.sort((a, b) => a.charIndex - b.charIndex);

        results.forEach(({charIndex, isCurrent}) => {
            // 添加匹配前的文本
            result += escapeHtml(lineText.substring(lastIndex, charIndex));

            // 添加高亮的匹配文本
            const matchedText = lineText.substring(charIndex, charIndex + keyword.length);

            if (isCurrent) {
                result += `<span class="highlight" id="current-highlight">${escapeHtml(matchedText)}</span>`;
            } else {
                result += `<span style="background-color: rgba(255, 255, 0, 0.3);">${escapeHtml(matchedText)}</span>`;
            }

            lastIndex = charIndex + keyword.length;
        });

        // 添加剩余的文本
        result += escapeHtml(lineText.substring(lastIndex));

        return result;
    }

    // 转义HTML特殊字符
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 清除所有高亮
    function clearHighlights() {
        const lines = fullLogText.split('\n');
        let base = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (!currentFilter || line.includes(currentFilter)) base.push(line);
        }
        const logLines = logEl.children;
        for (let i = 0; i < logLines.length && i < base.length; i++) {
            logLines[i].innerHTML = escapeHtml(base[i]);
        }
    }

    // 滚动到当前结果
    function scrollToCurrentResult() {
        if (searchResults.length === 0 || currentResultIndex < 0) return;

        // 尝试找到当前高亮的元素
        const currentHighlightElement = document.getElementById('current-highlight');
        if (currentHighlightElement) {
            const toolbar = document.getElementById('toolbar');
            const toolbarHeight = toolbar ? toolbar.offsetHeight : 0;
            const elementRect = currentHighlightElement.getBoundingClientRect();
            const absoluteElementTop = elementRect.top + window.pageYOffset;

            // 计算目标滚动位置：将高亮元素定位在屏幕中央（考虑工具栏）
            const targetPosition = absoluteElementTop - toolbarHeight - (window.innerHeight - toolbarHeight) / 2 + elementRect.height / 2;

            // 确保不会滚动到负数位置
            const finalPosition = Math.max(0, targetPosition);

            window.scrollTo({
                top: finalPosition,
                behavior: 'smooth'
            });
            return;
        }

        // 如果找不到高亮元素，回退到行级别滚动
        const currentResult = searchResults[currentResultIndex];
        if (!currentResult) return;
        const displayIndex = displayedIndexMap.get(currentResult.lineIndex);
        if (displayIndex === undefined || displayIndex >= logEl.children.length) return;
        const lineElement = logEl.children[displayIndex];
        const toolbar = document.getElementById('toolbar');
        const toolbarHeight = toolbar ? toolbar.offsetHeight : 0;
        const elementRect = lineElement.getBoundingClientRect();
        const absoluteElementTop = elementRect.top + window.pageYOffset;
        const middle = (window.innerHeight - toolbarHeight) / 2;
        const scrollToPosition = absoluteElementTop - toolbarHeight - middle + elementRect.height / 2;
        window.scrollTo({ top: Math.max(0, scrollToPosition), behavior: 'smooth' });
    }

    // 下一个
    function searchNext() {
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput.value.trim();
        if (!keyword) return;

        // 如果是新的搜索关键字，执行新搜索
        if (currentSearch !== keyword) {
            performSearch();
            return;
        }

        // 如果没有搜索结果，执行新搜索
        if (searchResults.length === 0) {
            performSearch();
            return;
        }

        // 移动到下一个结果
        currentResultIndex = (currentResultIndex + 1) % searchResults.length;
        applyHighlights(); // 直接应用高亮，避免重新渲染
        updateSearchStatus();
    }

    // 上一个
    function searchPrev() {
        const searchInput = document.getElementById('searchInput');
        const keyword = searchInput.value.trim();
        if (!keyword) return;

        // 如果是新的搜索关键字，执行新搜索
        if (currentSearch !== keyword) {
            performSearch();
            return;
        }

        // 如果没有搜索结果，执行新搜索
        if (searchResults.length === 0) {
            performSearch();
            return;
        }

        // 移动到上一个结果
        currentResultIndex = (currentResultIndex - 1 + searchResults.length) % searchResults.length;
        applyHighlights(); // 直接应用高亮，避免重新渲染
        updateSearchStatus();
    }


    // 高亮当前结果
    function updateSearchStatus() {
        if (searchResults.length > 0) {
            searchStatusEl.textContent = `${currentResultIndex + 1}/${searchResults.length}`;
        } else {
            searchStatusEl.textContent = '0/0';
        }
    }

    // 清除搜索
    function clearSearch() {
        currentSearch = '';
        searchResults = [];
        currentResultIndex = -1;
        searchStatusEl.textContent = '';
        document.getElementById('searchInput').value = '';
        
        // 重新渲染以清除高亮
        render();
    }

</script>
</body>
</html>
