name: 自动构建与发布 Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v0.4.3 的 tag 时自动触发构建发布
  workflow_dispatch: # 也支持在 GitHub Actions 网页上手动点击触发

permissions:
  contents: write # 开启写入权限，使 GitHub 自动注入的 GITHUB_TOKEN 具备发版权限（无需手动创建 Key）

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 准备正式签名密钥 (如果已配置)
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            mkdir -p key
            echo "$SIGNING_KEY" | base64 --decode > key/ycKey.jks
            echo "已成功还原签名文件 key/ycKey.jks"
          else
            echo "未配置正式签名密钥，将回退生成 debug 签名包"
          fi

      - name: 编译 Normal Release APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleNormalRelease --stacktrace

      - name: 清理临时密钥
        if: always()
        run: rm -f key/ycKey.jks

      - name: 整理输出 APK
        run: |
          mkdir -p release_outputs
          find app/build/outputs/apk/ -name "*Normal*.apk" -exec cp {} release_outputs/ \;
          echo "已成功整理以下 Normal APK 安装包："
          ls -lh release_outputs/

      - name: 验证 APK 签名状态
        run: |
          for apk in release_outputs/*.apk; do
            echo "正在验证 $apk 签名状态..."
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$apk" || true
          done

      - name: 自动创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_outputs/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          # 此 Token 为 GitHub 系统全自动提供，完全无需在后台手动添加或配置密钥
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
