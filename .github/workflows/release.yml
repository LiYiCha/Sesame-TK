name: 自动构建与发布 Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v0.4.3 的 tag 时自动触发构建发布
  workflow_dispatch: # 也支持在 GitHub Actions 网页上手动点击触发

permissions:
  contents: write # 开启写入权限，使 GitHub 自动注入的 GITHUB_TOKEN 具备发版权限（无需手动创建 Key）

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 配置 Release 签名密钥
        if: ${{ env.ANDROID_SIGNING_KEY != '' }}
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          mkdir -p key
          echo "$ANDROID_SIGNING_KEY" | base64 --decode > key/ycKey.jks

      - name: 编译 Release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 整理输出 APK
        run: |
          mkdir -p release_outputs
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_outputs/ \;
          echo "已成功编译以下 APK 安装包："
          ls -lh release_outputs/

      - name: 自动创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: release_outputs/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          # 此 Token 为 GitHub 系统全自动提供，完全无需在后台手动添加或配置密钥
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
