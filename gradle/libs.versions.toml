[versions]
activity-compose = "1.13.0"

android-plugin = "8.13.0"
constraintlayout = "2.2.2"

kotlin-plugin = "2.2.20"
kotlin-stdlib = "2.2.20"
shizukuVersion = "13.1.5"
slf4j = "2.0.18"
logback-android = "3.0.0"
appcompat = "1.8.0"
recyclerview = "1.4.0"
viewpager2 = "1.1.0"
material = "1.14.0"
lombok = "1.18.46"
okhttp = "5.4.0"
# jackson 锁定 2.16.x：2.17 起引入 value class 的 MethodHandle.invokeExact，minSdk 24 无法 dex
jackson = "2.16.2"

#noinspection GradleDependency
jackson-compatible = "2.13.5"
webkit = "1.17.0"
core-ktx = "1.17.0"
dexkit = "2.2.0"
desugar = "2.1.5"
documentfile = "1.0.1"

compose-bom = "2026.06.01"
lifecycle = "2.10.0"
coroutines = "1.11.0"
coil = "2.7.0"
kotlinx-serialization = "1.11.0"
nanohttpd = "2.3.1"
mmkv = "2.4.1"
zip4j = "2.11.6"

[libraries]

androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
rikka-shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizukuVersion" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logback-android" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
#noinspection SimilarGradleDependency
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
#noinspection SimilarGradleDependency
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
#noinspection SimilarGradleDependency
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
#noinspection SimilarGradleDependency
jackson-core-compatible = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson-compatible" }
#noinspection SimilarGradleDependency
jackson-databind-compatible = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-compatible" }
#noinspection SimilarGradleDependency
jackson-annotations-compatible = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-compatible" }

#noinspection Aligned16KB
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Lifecycle
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Coroutines
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-plugin" }
android-library = { id = "com.android.library", version.ref = "android-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-plugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-plugin" }
