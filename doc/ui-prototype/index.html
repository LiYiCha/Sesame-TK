<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务时间线 · 界面设计稿</title>
<style>
:root{
  --page:#0c0e12; --bg2:#101318; --card:#171b22; --card2:#1d222b; --line:#242a34;
  --text:#e7eaf0; --muted:#8b93a3; --dim:#5d6574;
  --accent:#4c8dff; --ok:#37c26b; --warn:#e8a33d;
}
[data-theme="light"]{
  --page:#eef1f6; --bg2:#f6f8fb; --card:#ffffff; --card2:#f3f5f9; --line:#e6eaf1;
  --text:#1d2129; --muted:#6b7280; --dim:#9aa2b1;
  --accent:#1976d2; --ok:#12a150; --warn:#c77700;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:13px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 20px 30px}
header{width:382px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
header h1{font-size:15px;margin:0;font-weight:600}
header .sub{color:var(--muted);font-size:11.5px}
.btn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:5px 11px;font-size:11.5px;cursor:pointer}
.note{width:382px;color:var(--dim);font-size:11.5px;margin:0 0 14px}

.phone{width:382px;height:806px;border-radius:38px;background:#05070a;border:8px solid #22262f;
  box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);position:relative;overflow:hidden}
[data-theme="light"] .phone{border-color:#c9cfdb;box-shadow:0 20px 46px rgba(20,30,60,.18)}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:22px;border-radius:11px;background:#05070a;z-index:6}
[data-theme="light"] .notch{background:#c9cfdb}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg2)}
.sbar{height:34px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 3px;font-size:10.5px;color:var(--muted)}
.navbar{height:46px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  border-bottom:1px solid var(--line);background:var(--bg2);position:relative}
.navbar .back{position:absolute;left:16px;color:var(--muted);font-size:15px}
.navbar .act{position:absolute;right:16px;color:var(--muted);font-size:12px;font-weight:400}
.body{flex:1;overflow-y:auto;padding:10px 12px 20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

/* 顶部汇总 */
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum .it{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.sum .n{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sum .k{font-size:10.5px;color:var(--muted);margin-top:1px}

/* 时间轴 */
.tl{padding:2px 0 6px}
.tl-i{display:grid;grid-template-columns:52px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl-i:before{content:"";position:absolute;left:52px;top:22px;bottom:-4px;width:1px;background:var(--line)}
.tl-i:last-child:before{display:none}
.tl-t{font-size:11.5px;color:var(--muted);text-align:right;padding-top:7px;font-variant-numeric:tabular-nums}
.tl-c{margin-left:14px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:8px 10px;position:relative}
.tl-c:before{content:"";position:absolute;left:-19px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px var(--bg2)}
.tl-c.ok:before{background:var(--ok)}
.tl-c.warn:before{background:var(--warn)}
.tl-c .t1{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tl-c .t2{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.grp{font-size:10px;font-weight:400;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.state{font-size:10px;font-weight:400;border-radius:99px;padding:0 6px;border:1px solid var(--line);color:var(--muted);margin-left:auto}
.state.ok{color:var(--ok);border-color:rgba(55,194,107,.3)}
.state.warn{color:var(--warn);border-color:rgba(232,163,61,.3)}
.foot{width:382px;color:var(--dim);font-size:11px;margin-top:12px;line-height:1.7}
</style>
</head>
<body data-theme="dark">
<header>
  <h1>任务时间线</h1>
  <span class="sub">只读页面，不发网络请求</span>
  <button class="btn" onclick="toggleTheme()">切换主题</button>
</header>
<p class="note">数据来自调度器快照：下次触发时间 + 最近一次执行结果。未运行过的任务显示「待首次执行」，不用推测时间填充。</p>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="sbar"><span>21:36</span><span>5G ▮▮▮ 86%</span></div>
    <div class="navbar"><span class="back">‹</span>任务时间线<span class="act">刷新</span></div>
    <div class="body">
      <div class="sum">
        <div class="it"><div class="n" id="s1">8</div><div class="k">今日任务</div></div>
        <div class="it"><div class="n" id="s2" style="color:var(--ok)">3</div><div class="k">已执行</div></div>
        <div class="it"><div class="n" id="s3" style="color:var(--warn)">1</div><div class="k">部分失败</div></div>
        <div class="it"><div class="n" id="s4" style="color:var(--dim)">4</div><div class="k">待执行</div></div>
      </div>
      <div class="tl" id="tl"></div>
    </div>
  </div>
</div>
<p class="foot">状态取最近一次运行结果：成功（绿）／部分失败（橙，附失败项数）／待执行（灰）。<br>时间列取各任务的下次触发点；分组标签沿用设置页的模型分组。</p>

<script>
const T = [
  {t:'07:00', n:'蚂蚁森林', g:'森林', s:'ok',   d:'收取能量 126g · 帮收 4 次'},
  {t:'07:30', n:'蚂蚁庄园', g:'庄园', s:'ok',   d:'喂食 3 次 · 收取饲料 2 份'},
  {t:'08:00', n:'饿了么',   g:'饿了么', s:'warn', d:'2 个任务 405 受限，其余完成'},
  {t:'10:00', n:'兑换任务', g:'青春特权', s:'',  d:'饿了么商城秒杀 · 待执行'},
  {t:'10:30', n:'其他任务', g:'其他', s:'ok',   d:'已执行'},
  {t:'12:00', n:'会员任务', g:'会员', s:'',     d:'待执行'},
  {t:'20:00', n:'兑换任务', g:'青春特权', s:'',  d:'游戏中心金币 · 待执行'},
  {t:'22:00', n:'其他任务2', g:'其他2', s:'',   d:'待执行'}
];
const label = s => s==='ok' ? '<span class="state ok">成功</span>'
  : s==='warn' ? '<span class="state warn">部分失败</span>'
  : '<span class="state">待执行</span>';

document.getElementById('tl').innerHTML = T.map(x=>`
  <div class="tl-i">
    <div class="tl-t">${x.t}</div>
    <div class="tl-c ${x.s}">
      <div class="t1">${x.n}<span class="grp">${x.g}</span>${label(x.s)}</div>
      <div class="t2">${x.d}</div>
    </div>
  </div>`).join('');

function toggleTheme(){
  const b = document.body;
  b.dataset.theme = b.dataset.theme==='dark' ? 'light' : 'dark';
}
if(location.hash==='#light'){ document.body.dataset.theme='light'; }
</script>
</body>
</html>
